apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "login.fullname" . }}-login
  {{- if .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
{{ include "login.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.login.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "login.fullname" . }}-login
  template:
    metadata:
      labels:
        app: {{ include "login.fullname" . }}-login
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - env:
            - name: HYDRA_ADMIN_URL
              value: {{ .Values.login.hydraAdminUrl }}
            - name: MAILSERVER_DOMAIN
              value: {{ .Values.login.mailserverDomain }}
            - name: PROFILE_DOMAIN
              value: {{ .Values.login.profileDomain | default "cryptoverse.cc" }}
            - name: WALLETCONNECT_PROJECT_ID
              value: {{ .Values.login.walletConnectProjectId | default "" | quote }}
            - name: PORT
              value: {{ .Values.login.deployment.port | quote}}
            - name: VERSION
              value: {{ .Values.version | quote }}
            - name: SENTRY_DSN
              value: {{ .Values.sentryDSN }}
            - name: SENTRY_ENV
              value: {{ .Values.sentryEnv }}
            - name: INFURA_API_KEY
              value: {{ .Values.infuraApiKey }}
            - name: ALCHEMY_API_KEY
              value: {{ .Values.alchemyApiKey }}
            {{- if .Values.ethRpcUrl }}
            # Full mainnet JSON-RPC URL. The core eth client prefers
            # ALCHEMY_API_KEY, then INFURA_API_KEY, then ETH_RPC_URL, then a
            # public default. Only rendered when set, so it never shadows a key.
            - name: ETH_RPC_URL
              value: {{ .Values.ethRpcUrl | quote }}
            {{- end }}
            {{- if .Values.login.ethRpcUrlFallback }}
            # Secondary mainnet JSON-RPC URL the backend falls back to when the
            # primary RPC errors/times out. Only rendered when set (mirrors
            # ETH_RPC_URL) so it never injects an empty value.
            - name: ETH_RPC_URL_FALLBACK
              value: {{ .Values.login.ethRpcUrlFallback | quote }}
            {{- end }}
            - name: SIWE_CHAIN_ID
              value: {{ .Values.login.chainId | default 1 | quote }}
            - name: SIWE_STATEMENT
              value: {{ .Values.login.siweStatement | default "Sign in to Cryptoverse Login" | quote }}
            - name: RPC_TIMEOUT_MS
              value: {{ .Values.login.rpcTimeoutMs | default 3000 | quote }}
            - name: EMAIL_VERIFIED_CLAIM
              value: {{ .Values.login.emailVerifiedClaim | default false | quote }}
            # Seconds Hydra remembers an authenticated session (SSO + enables
            # RP-initiated/back-channel logout). 0 = re-sign every login.
            - name: REMEMBER_FOR
              value: {{ .Values.login.rememberFor | default 3600 | quote }}
            # Path to the global login-deny blocklist (blocklist.json, mounted
            # from the login ConfigMap at /config). Set explicitly for clarity;
            # the backend defaults to this same path if unset.
            - name: BLOCKLIST_FILE
              value: /config/blocklist.json
            - name: DEBUG
              value: "{{ .Values.debug }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.registry }}/{{ .Values.login.image.repository }}:{{ .Values.version }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          name: login
          resources: {}
          volumeMounts:
            - mountPath: /app/secrets
              name: secrets
            - mountPath: /config
              name: config
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.login.deployment.port }}
          # Both probes hit the RPC-INDEPENDENT /healthz so a mainnet RPC outage
          # never amplifies into pod restarts / removal from the Service.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
      restartPolicy: Always
      volumes:
        - name: secrets
          secret:
            secretName: {{ include "login.fullname" . }}-login
        - name: config
          configMap:
            name: {{ include "login.fullname" . }}-login
