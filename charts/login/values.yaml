domain: login.cryptoverse.cc
version: 1.0.0
sentryDSN: "..."
sentryEnv: "development"
registry: registry.digitalocean.com/cryptoverse

db:
  host: "db-host"
  port: "5432"
  name: "db-name"
  user: "db-user"
  pass: "db-pass"

secretsSystem: []

djangoSecrets: "!!! CHANGE THIS !!!"

ingressClassName: nginx

# cert-manager ClusterIssuer for the ingress TLS cert. Set empty to omit the
# cert-manager.io/cluster-issuer annotation entirely (e.g. local/kind, where the
# TLS secret is supplied out-of-band as a self-signed cert).
certManagerIssuer: cryptoverse-common

hydra:
  hydra-maester:
    forwardedProto: https
    nameOverride: hydra-maester-cryptoverse-login
    hydraAdmin:
      url: http://cryptoverse-login-hydra-admin.cryptoverse-login
      port: 4445
      endpoint: /clients
      forwardedProto: https
  hydra: # Overrride `hydra` subchart values
    existingSecret: "cryptoverse-login-hydra" # pragma: allowlist secret
    automigration:
      enabled: true
    config:
      # Issue VERIFIABLE JWT access tokens instead of opaque (DB-backed) ones, so
      # relying parties can validate access tokens offline against the published
      # JWKS. Hydra signs them with its `hydra.jwt.access-token` key set, published
      # in the same JWKS at /.well-known/jwks.json (advertised via discovery's
      # jwks_uri). Tradeoff: JWT access tokens CANNOT be revoked before expiry
      # (opaque ones can, since they're looked up in the DB) — so keep access-token
      # TTLs short (left at Hydra defaults here); introspection still works for
      # callers that want revocation freshness (it's token-format-independent).
      strategies:
        access_token: jwt
      log:
        level: info
        leak_sensitive_values: true
      serve:
        public:
          port: 4444
          request_log:
            disable_for_health: true
        admin:
          port: 4445
          request_log:
            disable_for_health: true
        tls:
          allow_termination_from:
            - 10.0.0.0/8
            - 127.0.0.0/24
      oidc:
        subject_identifiers:
          supported_types:
            - public
          pairwise:
            salt: "!!! CHANGE THIS !!!"
        dynamic_client_registration:
          enabled: true
          default_scope:
            - openid
      urls:
        login: https://login.cryptoverse.cc/login
        consent: https://login.cryptoverse.cc/consent
        device:
          verification: https://login.cryptoverse.cc/device
          success: https://login.cryptoverse.cc/device/success
        self:
          issuer: https://login.cryptoverse.cc/

introspectAccess:
  user: "!!! CHANGE THIS !!!"
  pass: "!!! CHANGE THIS !!!"
infuraApiKey: "!!! CHANGE THIS !!!"
alchemyApiKey: "!!! CHANGE THIS !!!"
# Optional full mainnet JSON-RPC URL. Used by the core eth client only when
# neither alchemyApiKey nor infuraApiKey is set (precedence: Alchemy > Infura >
# ETH_RPC_URL > built-in public default). Leave empty in production and supply a
# dedicated Alchemy/Infura key instead.
#
# WARNING: when this is "" AND no Alchemy/Infura key is set, the backend falls
# back to a *public* mainnet node (rate-limited, best-effort, not for
# production). On-chain enrichment (ENS / Unstoppable Domains) and token-gating
# (balanceOf) then run against that public RPC. Supply a dedicated key in prod.
ethRpcUrl: ""

gateway:
  replicaCount: 1
  deployment:
    port: 8000
  service:
    port: 8000
  image:
    repository: cryptoverse-login/gateway

login:
  replicaCount: 1
  deployment:
    port: 3000
  service:
    port: 80
  image:
    repository: cryptoverse-login/login
  # TODO: remember to tie namespace to release namespace
  hydraAdminUrl: http://cryptoverse-login-hydra-admin.cryptoverse-login:4445
  mailserverDomain: ethmail.cc
  # WalletConnect Cloud / Reown project id for the SPA's WalletConnect connector.
  # Empty disables WalletConnect (injected wallets still work). Override per env.
  # Also enables hardware wallets (Ledger Live, Trezor Suite), which connect via
  # WalletConnect — needs mainnet (chainId 1) + personal_sign in the Reown dashboard.
  walletConnectProjectId: ""
  # SIWE (EIP-4361) chain id the backend issues + verifies against. Mainnet = 1.
  # → SIWE_CHAIN_ID env.
  chainId: 1
  # SIWE statement line shown to the user in the wallet sign prompt.
  # → SIWE_STATEMENT env.
  siweStatement: "Sign in to Cryptoverse Login"
  # Whether the id_token asserts email_verified=true for the synthesized
  # {address}@MAILSERVER_DOMAIN email. Default false (the address is verified, the
  # mailbox is not). Set true only if a real mailserver backs the domain.
  # → EMAIL_VERIFIED_CLAIM env.
  emailVerifiedClaim: false
  # Per-request timeout (ms) for on-chain JSON-RPC calls (ENS / Unstoppable
  # Domains / balanceOf). Bounds login latency on a slow/unreachable RPC.
  # → RPC_TIMEOUT_MS env.
  rpcTimeoutMs: 3000
  # Optional secondary mainnet JSON-RPC URL the backend falls back to when the
  # primary RPC errors/times out. Empty ⇒ env not rendered (mirrors ethRpcUrl).
  # → ETH_RPC_URL_FALLBACK env.
  ethRpcUrlFallback: ""
  # Token-gating restrictions rendered into the login ConfigMap as
  # restrictions.json (backend RESTRICTIONS_FILE fallback), keyed by client_id.
  # Each entry has a tokenAddress (or contractAliases) plus an evalexpr
  # `condition` over balanceOf. Set to {} to ship no file-based restrictions.
  restrictions:
    flynnjamm.cryptoverse.cc:
      - tokenAddress: "0x56687cf29ac9751ce2a4e764680b6ad7e668942e"
        condition: "balanceOf >= 1000"
    fwb.cryptoverse.cc:
      - tokenAddress: "0x7d91e637589EC3Bb54D8213a9e92Dc6E8D12da91"
        condition: "balanceOf >= 100"
  # Global login-deny blocklist (defense-in-depth): a flat list of Ethereum
  # addresses that are DENIED login regardless of relying party. Rendered into
  # the login ConfigMap as blocklist.json (backend BLOCKLIST_FILE,
  # /config/blocklist.json), re-read per request. Matching is case-insensitive,
  # so checksum casing does not matter. Empty (the default) blocks nobody.
  blocklist: []

wrapper:
  replicaCount: 1
  deployment:
    port: 3000
  service:
    port: 80
  image:
    repository: cryptoverse-login/wrapper
  # Open-redirect allowlist for the wrapper's /oauth2/final endpoint, rendered
  # into the ALLOWED_REDIRECT_HOSTS env (comma-joined). List the hostnames of
  # your relying-party (OAuth2 client) redirect/callback URLs here.
  #
  # EMPTY (the default) DISABLES the protection: /oauth2/final will accept any
  # http(s) redirect target, which is an open-redirect risk. Operators SHOULD
  # set this to their RP hosts, e.g.:
  #   allowedRedirectHosts:
  #     - app.example.com
  #     - dashboard.example.com
  allowedRedirectHosts: []

# Default values for help.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

imagePullPolicy: IfNotPresent
imagePullSecrets: []

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

monitoring:
  enabled: true
