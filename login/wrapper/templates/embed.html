<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login with Ethereum Wallet</title>
    <script
      id="sentry"
      src="/login/sentry.min.js"
      crossorigin="anonymous"
    ></script>
    <script>
      Sentry.onLoad(function () {
        Sentry.init({
          release: "{{ version }}",
          environment: "{{ sentry_env }}",
        });
      });
    </script>
    <script
      type="module"
      src="/login/static/js/embed.js"
      crossorigin="anonymous"
    ></script>
    <style>
      /* First-paint Vault styling — shown before the React iframe loads. Matches
         the app's dark navy base + violet accent so the very first frame is
         coherent. Only the loader/background visuals are styled here; the
         iframe wiring and scripts below are untouched. */
      body {
        margin: 0;
        background: linear-gradient(180deg, #0b1020 0%, #0e1426 100%);
        background-attachment: fixed;
        color: #e8eaf2;
      }

      #loader {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 1;
        box-sizing: border-box;
        width: 96px;
        height: 96px;
        margin: -48px 0 0 -48px;
        border: 4px solid #232b42;
        border-radius: 50%;
        border-top: 4px solid #7c6cf0;
        -webkit-animation: spin 1s linear infinite;
        animation: spin 1s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        #loader {
          -webkit-animation: none;
          animation: none;
        }
      }

      @-webkit-keyframes spin {
        0% {
          -webkit-transform: rotate(0deg);
        }
        100% {
          -webkit-transform: rotate(360deg);
        }
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      #auth {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        width: 100%;
        height: 100%;
        border: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="loader"></div>
    <iframe id="auth" src=""></iframe>
    <script>
        window.addEventListener("load", async (event) => {
            await window.ready; // Wait for Comlink exposing this context
            const iframe = document.getElementById("auth");
            // `tojson` produces a safe JS string literal (no breakout/injection);
            // the backend also validates `url` is an absolute http(s) URL.
            iframe.src = {{ url|tojson }};
        });
    </script>
  </body>
</html>
