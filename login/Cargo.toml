[workspace]
resolver = "2"
members = ["core", "login", "wrapper"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cryptoverse-cc/login"

[workspace.dependencies]
cryptoverse-core = { path = "core" }

# Web / async
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "reqwest", "rustls"] }
sentry-tower = { version = "0.34", features = ["http"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# Templating
minijinja = { version = "2", features = ["loader"] }

# Ethereum / SIWE
siwe = "0.6"
alloy = { version = "1.0", default-features = false, features = [
    "std",
    "provider-http",
    "contract",
    "json",
    "rpc-types-eth",
    "network",
    "reqwest-rustls-tls",
] }
evalexpr = "12"

# HTTP client / serde / misc
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
time = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
