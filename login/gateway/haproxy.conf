global
  daemon
  tune.ssl.default-dh-param 4096
  log stdout format raw local0 debug

defaults
  timeout connect 5000ms
  timeout client 50000ms
  timeout server 50000ms
  log global
  option httplog

userlist IntrospectUsersList
    user "${INTROSPECT_ACCESS_USER}" insecure-password "${INTROSPECT_ACCESS_PASS}"

##############
# Global Web #
##############

frontend web
    bind "*:${PORT}"
    mode http

    compression algo gzip

    capture response header Location len 1024

    # Derive the public origin from the request. The TLS-terminating ingress
    # forwards X-Forwarded-Host / X-Forwarded-Proto; we fall back to Host / https.
    # No hardcoded domain or port: the system works on whatever host:port the
    # ingress is configured for.
    http-request set-var(txn.pub_host) req.hdr(x-forwarded-host)
    http-request set-var(txn.pub_host) req.hdr(host) if !{ var(txn.pub_host) -m found }
    http-request set-var(txn.pub_proto) req.hdr(x-forwarded-proto)
    http-request set-var(txn.pub_proto) str(https) if !{ var(txn.pub_proto) -m found }

    http-request set-var(txn.consent_request) urlp(consent_verifier)
    acl consent_response var(txn.consent_request) -m found
    http-response set-var(res.finallocation) res.hdr(location) if consent_response
    http-response del-header location if consent_response
    http-response add-header location "%[var(txn.pub_proto)]://%[var(txn.pub_host)]/oauth2/final?url=%[var(res.finallocation)]" if consent_response

    # Routing is purely path-based; host routing is the ingress's job.
    acl introspect                  path_beg /oauth2/introspect
    acl authorized                  http_auth(IntrospectUsersList)
    http-request auth realm Token if introspect !authorized

    acl wrapper                     path_beg /oauth2/auth
    acl wrapper                     path_beg /oauth2/final
    acl login_verify                urlp_reg(login_verifier) .*
    acl consent_verify              urlp_reg(consent_verifier) .*
    acl login                       path_beg /consent
    acl login                       path_beg /login
    acl login                       path_beg /logout
    acl login                       path_beg /device

    use_backend login               if login
    use_backend wrapper             if wrapper !login_verify !consent_verify
    use_backend private             if introspect authorized
    default_backend auth

backend auth
    mode http
    balance roundrobin
    option forwardfor
    stick-table type ip size 200k expire 30m
    stick on src
    acl inner path_beg /oauth2/inner
    http-request set-path /oauth2/auth if inner
    server node1 "${HYDRA_PUBLIC_SERVICE}"

backend private
    mode http
    balance roundrobin
    option forwardfor
    stick-table type ip size 200k expire 30m
    stick on src
    http-request set-header X-Client-IP %[src]
    http-request set-path /admin%[path]
    server node1 "${HYDRA_ADMIN_SERVICE}"
    http-request del-header Authorization

backend login
    mode http
    balance roundrobin
    option forwardfor
    stick-table type ip size 200k expire 30m
    stick on src
    server node1 "${LOGIN_SERVICE}"

backend wrapper
    mode http
    balance roundrobin
    option forwardfor
    stick-table type ip size 200k expire 30m
    stick on src
    server node1 "${WRAPPER_SERVICE}"
