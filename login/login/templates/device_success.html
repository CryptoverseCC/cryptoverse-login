<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Signed in</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #e8eaed;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #181b22;
      border: 1px solid #2a2f3a;
      border-radius: 14px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    .check {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(53, 199, 89, 0.15);
      border: 1px solid rgba(53, 199, 89, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #35c759;
      font-size: 1.8rem;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { margin: 0; color: #aab0bd; font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="check">&#10003;</div>
    <h1>You're signed in</h1>
    <p>You can return to your device or app. This window can be closed.</p>
  </main>
</body>
</html>
