name: Built & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  # Needs to match "domain" value in values.ci.yaml
  DOMAIN_LOGIN: login.cryptoverse.local
  DOMAIN_DEMO_APP: login-demo.cryptoverse.local
  PROJECT: cryptoverse-login
  REGISTRY: registry.digitalocean.com/cryptoverse
  ASSETS_PATH: /tmp/assets/

jobs:
  # Rust workspace unit + integration tests. Runs in PARALLEL with the image
  # builds and needs no cluster. This is the first place the workspace `cargo
  # test` runs in CI — and it includes the deterministic ERC-1271 smart-account
  # signature integration test (tests/erc1271_anvil.rs), which spins up a local
  # `anvil` (installed by foundry-toolchain). `CV_REQUIRE_ANVIL=1` makes a missing
  # anvil a hard failure so CI can never silently lose that smart-account coverage.
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: login
      - uses: foundry-rs/foundry-toolchain@v1
      - name: cargo test (workspace, incl. ERC-1271 anvil)
        working-directory: login
        env:
          CV_REQUIRE_ANVIL: "1"
        run: cargo test --workspace
  build-gateway:
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - uses: actions/checkout@v3
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: login/gateway
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.PROJECT }}/gateway:${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build-login:
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - uses: actions/checkout@v3
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          # Context is the Cargo workspace root (shared `core` crate).
          context: login
          file: login/login/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.PROJECT }}/login:${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build-wrapper:
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - uses: actions/checkout@v3
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: login
          file: login/wrapper/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.PROJECT }}/wrapper:${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build-demo:
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - uses: actions/checkout@v3
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: tests/cryptoverse-login-demo/demo
          push: true
          tags: "${{ env.REGISTRY }}/${{ env.PROJECT }}/demo-python-django:${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
  test:
    runs-on: ubuntu-latest
    environment: CI
    needs:
      - build-gateway
      - build-login
      - build-wrapper
      - build-demo
    steps:
      - uses: actions/checkout@v3
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - uses: balchua/microk8s-actions@v0.3.1
        with:
          channel: "latest/stable"
          addons: '["dns", "ingress"]'
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      #####################
      # Cryptoverse Login #
      #####################
      - name: Create Namespace and log in to DO Container Registry
        run: |
          kubectl create namespace cryptoverse-login-${{ github.sha }}
          doctl registry login --expiry-seconds 1200
          doctl registry kubernetes-manifest --namespace cryptoverse-login-${{ github.sha }} | kubectl apply -f -
      - name: Resolve domain to localhost #TODO resolve to cluster ip
        run: |
          echo "127.0.0.1 ${DOMAIN_LOGIN}" | sudo tee -a /etc/hosts
      - name: Certs
        run: |
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -out local.crt \
            -keyout local.key \
            -subj "/CN=${DOMAIN_LOGIN}/O=Cryptoverse OU"
          sudo cp local.crt /etc/ssl/certs/
          sudo update-ca-certificates
          kubectl create secret tls cryptoverse-login \
            --namespace cryptoverse-login-${{ github.sha }} \
            --key local.key \
            --cert local.crt
          sleep 10s
      - name: Helm Dependencies
        run: |
          helm repo add ory https://k8s.ory.sh/helm/charts
          helm dependency update ./charts/login/
      - name: Install Cryptoverse Login
        run: |
          # login.walletConnectProjectId is set from the WALLETCONNECT_PROJECT_ID
          # secret. When the secret is absent (e.g. on forks) it expands to empty,
          # the SPA omits the WalletConnect connector, and the WC e2e step below
          # self-skips — so this is fork-safe with no `if: secrets...` gymnastics.
          helm upgrade --install --wait --timeout 10m \
            cryptoverse-login \
            ./charts/login/ \
            --namespace cryptoverse-login-${{ github.sha }} \
            -f ./charts/login/values.ci.yaml \
            --set version=${{ github.sha }} \
            --set login.walletConnectProjectId=${{ secrets.WALLETCONNECT_PROJECT_ID }} \
            --set login.hydraAdminUrl=http://cryptoverse-login-hydra-admin.cryptoverse-login-${{ github.sha }}:4445
      - name: Verify connectivity
        run: |
          curl https://${DOMAIN_LOGIN}/.well-known/openid-configuration -vk

      #####################
      # Backend harness   #
      #####################
      # Curl-driven backend suite (tests/harness/): the full OAuth2 + SIWE flow,
      # device grant, RP-initiated logout, acr/amr, token-gating, introspection,
      # SIWE error cases — no browser/display needed, so it's fast and broad
      # coverage the MetaMask e2e can't give. Runs against the stack deployed above.
      - name: Cache Rust (SIWE signer)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: login
      - name: Backend harness (tests/harness, curl-driven)
        run: |
          # The harness signs EIP-4361 messages with the Rust `sign` example.
          cargo build -p cryptoverse-core --example sign --manifest-path login/Cargo.toml
          python3 -m venv /tmp/harness-venv
          /tmp/harness-venv/bin/pip install -q -r tests/harness/requirements.txt
          # The harness runs on the runner (not in-cluster), so reach Hydra's admin
          # API via a port-forward.
          kubectl -n cryptoverse-login-${{ github.sha }} \
            port-forward svc/cryptoverse-login-hydra-admin 4445:4445 &
          PF=$!
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:4445/health/ready && break || sleep 1
          done
          # test_blocklist is ignored in CI: it mutates the login ConfigMap +
          # restarts the Deployment, which would disrupt the e2e that runs next in
          # this same job (it self-skips anyway without the kind kube-context).
          HARNESS_GATEWAY=https://${DOMAIN_LOGIN} HARNESS_HOST= \
            HARNESS_HYDRA_ADMIN=http://127.0.0.1:4445 \
            /tmp/harness-venv/bin/pytest tests/harness/ -v \
            --ignore=tests/harness/test_blocklist.py
          kill $PF || true

      ########
      # Demo #
      ########
      - name: Create Namespace and log in to DO Container Registry
        run: |
          kubectl create namespace cryptoverse-login-demo-${{ github.sha }}
          doctl registry login --expiry-seconds 1200
          doctl registry kubernetes-manifest --namespace cryptoverse-login-demo-${{ github.sha }} | kubectl apply -f -
      - name: Resolve demo app domain to localhost #TODO resolve to cluster ip
        run: |
          echo "127.0.0.1 ${DOMAIN_DEMO_APP}" | sudo tee -a /etc/hosts
      - name: Certs
        run: |
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -out local-demo.crt \
            -keyout local-demo.key \
            -subj "/CN=${DOMAIN_DEMO_APP}/O=Cryptoverse OU"
          sudo cp local-demo.crt /etc/ssl/certs/
          sudo update-ca-certificates
          kubectl create secret tls login-demo-tls \
            --namespace cryptoverse-login-demo-${{ github.sha }} \
            --key local-demo.key \
            --cert local-demo.crt
          sleep 2s
      - name: Install Cryptoverse Login Demo App (Python+Django)
        run: |
          helm upgrade --install --wait --timeout 10m \
            cryptoverse-login-demo \
            ./tests/cryptoverse-login-demo/charts/demo/ \
            --namespace cryptoverse-login-demo-${{ github.sha }} \
            -f ./tests/cryptoverse-login-demo/charts/demo/values.ci.yaml \
            --set version=${{ github.sha }} \
            --set tlsSecretName=login-demo-tls \
            --set demo.oidc.jwksEndpoint=http://cryptoverse-login-hydra-public.cryptoverse-login-${{ github.sha }}:4444/.well-known/jwks.json \
            --set demo.oidc.tokenEndpoint=http://cryptoverse-login-hydra-public.cryptoverse-login-${{ github.sha }}:4444/oauth2/token \
            --set demo.oidc.userEndpoint=http://cryptoverse-login-hydra-public.cryptoverse-login-${{ github.sha }}:4444/userinfo
        #   ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
        #   Using cryptoverse-login-hydra-public.ns instead of login.cryptoverse.local
        #   is a workaround for the demo app being in the same cluster
        #   and not being able to resolve login.cryptoverse.local from inside
        #   since it's defined in /etc/hosts on host machine
      - name: Verify connectivity
        run: |
          curl https://${DOMAIN_DEMO_APP}/ -vk

      # TODO: Test dynamic client registration
      #######################
      # Test using Demo App #
      #######################
      # Browser/wallet end-to-end via Playwright + dappwright (tests/e2e/), which
      # replaces the retired Selenium + Firefox + MetaMask suite (test_full.py).
      # All three connector projects run here: MetaMask and Coinbase each drive a
      # real browser extension under a virtual framebuffer (xvfb) and need no
      # projectId; WalletConnect drives a headless @reown/walletkit test wallet
      # (no extension, no xvfb) and runs whenever the WALLETCONNECT_PROJECT_ID
      # secret is set — it self-skips cleanly when the secret is empty (forks),
      # so the lane is fork-safe. See tests/e2e/README.md.
      - name: Browser e2e (MetaMask, Playwright + dappwright)
        env:
          # Point the suite at the demo RP deployed above (CI uses the
          # cryptoverse.local domains, not the kind-cluster nip.io defaults).
          DEMO_URL: https://${{ env.DOMAIN_DEMO_APP }}
          LOGIN_URL: https://${{ env.DOMAIN_LOGIN }}
        run: |
          mkdir -p ${ASSETS_PATH}
          cd tests/e2e
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium
          xvfb-run --auto-servernum yarn test:e2e:metamask
      - name: Browser e2e (Coinbase Wallet, Playwright + dappwright)
        env:
          # Same demo RP / IdP as the MetaMask step above. The Coinbase project
          # drives the real Coinbase Wallet extension via dappwright's Coinbase
          # SDK connector — no projectId/secret needed (unlike WalletConnect).
          DEMO_URL: https://${{ env.DOMAIN_DEMO_APP }}
          LOGIN_URL: https://${{ env.DOMAIN_LOGIN }}
        run: |
          cd tests/e2e
          # deps + chromium are already installed by the MetaMask step; dappwright
          # downloads the Coinbase extension on first run of this project.
          xvfb-run --auto-servernum yarn test:e2e:coinbase
      - name: Browser e2e (WalletConnect, headless @reown/walletkit test wallet)
        env:
          # Same demo RP / IdP as the steps above. The WalletConnect project drives
          # a HEADLESS test wallet (no browser extension), so it needs no xvfb — but
          # it DOES need a Reown projectId. WALLETCONNECT_PROJECT_ID is wired through
          # to the SPA's WC connector by the helm install step above; both must use
          # the SAME id. When the secret is empty (e.g. forks) the SPA omits the WC
          # connector and this project SELF-SKIPS cleanly (green) — so this step
          # always runs with no `if:` guard and stays fork-safe.
          DEMO_URL: https://${{ env.DOMAIN_DEMO_APP }}
          LOGIN_URL: https://${{ env.DOMAIN_LOGIN }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
        run: |
          cd tests/e2e
          # deps + chromium already installed by the MetaMask step. No extension,
          # no display needed — runs in plain headless Chromium.
          yarn test:e2e:walletconnect
      - name: Pods
        if: always()
        run: |
          kubectl get pods --namespace cryptoverse-login-${{ github.sha }} -o wide --show-labels
      - name: Services
        if: always()
        run: |
          kubectl get services --namespace cryptoverse-login-${{ github.sha }} -o wide --show-labels
      - name: Logs cryptoverse-login-gateway
        if: always()
        run: |
          kubectl logs --namespace cryptoverse-login-${{ github.sha }} --tail 1000 -l app=cryptoverse-login-gateway
      - name: Logs cryptoverse-login-login
        if: always()
        run: |
          kubectl logs --namespace cryptoverse-login-${{ github.sha }} --tail 1000 -l app=cryptoverse-login-login
      - name: Logs cryptoverse-login-wrapper
        if: always()
        run: |
          kubectl logs --namespace cryptoverse-login-${{ github.sha }} --tail 1000 -l app=cryptoverse-login-wrapper
      - name: Logs kubernetes.io/name=hydra
        if: always()
        run: |
          kubectl logs --namespace cryptoverse-login-${{ github.sha }} --tail 1000 -l app.kubernetes.io/name=hydra
      - name: Logs kubernetes.io/name=hydra-maester
        if: always()
        run: |
          kubectl logs --namespace cryptoverse-login-${{ github.sha }} --tail 1000 -l app.kubernetes.io/name=cryptoverse-login-hydra-maester-cryptoverse-login
      - name: Pods Demo
        if: always()
        run: |
          kubectl get pods --namespace cryptoverse-login-demo-${{ github.sha }} -o wide --show-labels
      - name: Logs Demo cryptoverse-login-demo
        if: always()
        run: |
          kubectl logs --namespace cryptoverse-login-demo-${{ github.sha }} --tail 1000 -l app=cryptoverse-login-demo
      - name: OAuth2Client
        if: always()
        run: |
          kubectl get oauth2client --namespace cryptoverse-login-demo-${{ github.sha }} -o=yaml
      - name: OAuth2Client Secret
        if: always()
        run: |
          kubectl get secrets cryptoverse-login-demo-oauth2client --namespace cryptoverse-login-demo-${{ github.sha }} -o=yaml
      - name: Microk8s - Gather debug info
        if: always()
        run: |
          cd ${ASSETS_PATH}
          microk8s inspect
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: assets
          path: /tmp/assets/
