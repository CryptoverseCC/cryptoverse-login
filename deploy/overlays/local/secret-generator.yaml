# KSOPS generator: tells kustomize to run the `ksops` exec plugin, which
# decrypts the listed SOPS files using the age key in the repo-server.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cryptoverse-login-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secret-login.sops.yaml
  - ./secret-hydra.sops.yaml
  - ./secret-postgres.sops.yaml
