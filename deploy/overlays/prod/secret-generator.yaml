# KSOPS generator for the PROD secrets — DEFERRED, not yet referenced by
# kustomization.yaml (its `generators:` entry is commented out).
#
# The prod SOPS age key does not exist yet. When the operator provisions it:
#   1. Append the prod age recipient to .sops.yaml (comma-separated, as the
#      comment there shows) — or add a prod-only creation rule.
#   2. Create the four *.sops.yaml files below, encrypted to the PROD recipient
#      (never the local key, never plaintext — only ENC[...] reaches git):
#        secret-login.sops.yaml     app secrets (RPC keys, Sentry, introspection auth, ...)
#        secret-hydra.sops.yaml     Hydra DSN + SECRETS_SYSTEM/SECRETS_COOKIE (fresh prod values)
#        secret-postgres.sops.yaml  Postgres credentials (fresh prod values)
#        secret-harbor-pull.sops.yaml  the `harbor-pull` dockerconfigjson (Harbor pull-only robot)
#   3. Uncomment the `generators:` block in kustomization.yaml.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cryptoverse-login-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secret-login.sops.yaml
  - ./secret-hydra.sops.yaml
  - ./secret-postgres.sops.yaml
  - ./secret-harbor-pull.sops.yaml
