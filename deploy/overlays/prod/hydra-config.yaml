# Hydra non-secret config for PROD. Env-specific: the issuer + login/consent/
# logout/device URLs carry the public host the browser reaches this IdP at.
# <<LOGIN_PROD_HOST>> is a placeholder — the prod hostname is not decided yet;
# the operator fills it in when it is (no port suffix: prod serves on standard
# 443, unlike the local overlay's :18443). It must match ingress.yaml's host.
# Mounted into the Hydra pod at /etc/config/hydra.yaml.
#
# Deliberate diffs from overlays/local: leak_sensitive_values is OFF in prod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cryptoverse-login-hydra
  labels:
    app.kubernetes.io/name: hydra
    app.kubernetes.io/instance: cryptoverse-login
data:
  hydra.yaml: |
    log:
      leak_sensitive_values: false
      level: info
    oidc:
      dynamic_client_registration:
        default_scope:
        - openid
        enabled: true
      subject_identifiers:
        supported_types:
        - public
    serve:
      admin:
        port: 4445
        request_log:
          disable_for_health: true
      public:
        port: 4444
        request_log:
          disable_for_health: true
      tls:
        # Trust X-Forwarded-Proto from in-cluster sources (pod/loopback CIDRs),
        # so Hydra treats ingress-terminated HTTPS requests as secure.
        allow_termination_from:
        - 10.0.0.0/8
        - 127.0.0.0/24
    strategies:
      access_token: jwt
    urls:
      consent: https://login.cryptoverse.cc/consent
      device:
        success: https://login.cryptoverse.cc/device/success
        verification: https://login.cryptoverse.cc/device
      login: https://login.cryptoverse.cc/login
      logout: https://login.cryptoverse.cc/logout
      post_logout_redirect: https://login.cryptoverse.cc/
      self:
        issuer: https://login.cryptoverse.cc/
