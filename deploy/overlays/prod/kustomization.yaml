apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cryptoverse-login
resources:
- ../../base
- ./hydra-config.yaml
- ./ingress.yaml
# Prod kubelets pull the custom images from Harbor with the pull-only robot: the
# `harbor-pull` dockerconfigjson Secret, referenced on every workload's pod spec.
# The Secret's CONTENTS are deferred (encrypted to the prod age key, which does
# not exist yet) — see the note on the generator below.
patches:
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: harbor-pull
# The deployed image tags live here, not in base — `just promote` (repo root)
# runs `kustomize edit set image` once per custom component to pin the blessed,
# immutable <commit-time>-<sha> tag on a release/tag. `name` matches the bare
# repo refs in base/; `newName` retargets them at this project's OWN Harbor
# project (per-project sub-project, NOT the platform's older shared
# "<harbor>/heavyops/<app>" path), so prod kubelets pull from Harbor, never from
# the local kind-registry. (postgres/hydra are upstream public images and stay
# pinned in base.)
images:
- name: localhost:5000/cryptoverse-login/gateway
  newName: 86id9433.gra7.container-registry.ovh.net/cryptoverse-login/gateway
  newTag: prod # placeholder; replaced by `just promote` with <commit-time>-<sha>
- name: localhost:5000/cryptoverse-login/login
  newName: 86id9433.gra7.container-registry.ovh.net/cryptoverse-login/login
  newTag: prod # placeholder; replaced by `just promote` with <commit-time>-<sha>
- name: localhost:5000/cryptoverse-login/wrapper
  newName: 86id9433.gra7.container-registry.ovh.net/cryptoverse-login/wrapper
  newTag: prod # placeholder; replaced by `just promote` with <commit-time>-<sha>
# DEFERRED — prod secrets. The prod SOPS age key does not exist yet; once the
# operator adds the prod age recipient to .sops.yaml, create the prod
# *.sops.yaml Secrets (login app, Hydra, Postgres, harbor-pull) encrypted to it
# (NEVER the local key, NEVER plaintext) and uncomment:
# generators:
# - ./secret-generator.yaml
