kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cryptoverse-login
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # The services derive their public origin from the request (X-Forwarded-*),
    # so any host:port works — no privileged :443 needed. Using a high host port
    # (9443 → node 443) means rootless podman needs no port sysctl.
    extraPortMappings:
      - containerPort: 443
        hostPort: 9443
        protocol: TCP
