# Demo app chart overrides for the local kind cluster.
# The browser-facing authorize endpoint uses the public login domain; the
# server-side OIDC calls (jwks/token/userinfo) use in-cluster service DNS,
# because the demo pod can't resolve the public nip.io name from inside.

domain: demo.127.0.0.1.nip.io
tlsSecretName: login-demo-tls

registry: localhost
version: test
imagePullPolicy: Never
imagePullSecrets: []

monitoring: false

restrictions: []

demo:
  oidcRedirectUrl: https://demo.127.0.0.1.nip.io/oidc/callback/
  logoutRedirectUrl: https://demo.127.0.0.1.nip.io/
  secret: "localdemosecret" # pragma: allowlist secret
  oidc:
    # Browser redirect -> public login domain (via the ingress on :443).
    authEndpoint: https://login.127.0.0.1.nip.io/oauth2/auth
    # Server-side -> in-cluster Hydra public service (cross-namespace DNS).
    jwksEndpoint: http://cryptoverse-login-hydra-public.cryptoverse-login:4444/.well-known/jwks.json
    tokenEndpoint: http://cryptoverse-login-hydra-public.cryptoverse-login:4444/oauth2/token
    userEndpoint: http://cryptoverse-login-hydra-public.cryptoverse-login:4444/userinfo
