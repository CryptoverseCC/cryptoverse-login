# The charts' ingresses are annotated cert-manager.io/cluster-issuer:
# cryptoverse-common (same as production). Locally we back that name with a CA
# issuer seeded from a local mkcert root (see setup.sh), so cert-manager issues
# both hosts' certs from one root you can trust on the machine running your
# browser — no per-host self-signed warnings (and the login iframe loads). The
# charts stay byte-identical to prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cryptoverse-common
spec:
  ca:
    secretName: cryptoverse-ca
