# The charts' ingresses are annotated cert-manager.io/cluster-issuer:
# cryptoverse-common (same as production). Locally we back that name with a
# self-signed issuer so cert-manager issues the ingress TLS certs automatically
# — the charts stay byte-identical to prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cryptoverse-common
spec:
  selfSigned: {}
