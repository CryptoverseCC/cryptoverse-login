# Login chart overrides for the local kind cluster — production-faithful:
# Postgres-backed Hydra (not in-memory), cert-manager TLS via the chart's
# cryptoverse-common ClusterIssuer, dangerousForceHttp behind the TLS ingress.
# Domains use nip.io (resolve to 127.0.0.1, no /etc/hosts needed); the ingress
# is on standard 443 because the gateway hardcodes the public origin as
# https://${DOMAIN} (no port).

sentryDSN: ""
sentryEnv: "kind"
domain: login.cv.127.0.0.1.nip.io

registry: localhost
version: test
imagePullPolicy: Never
imagePullSecrets: []

ingressClassName: nginx

# No cert-manager locally: setup.sh seeds the ingress TLS secret with a
# self-signed cert (openssl, like TokenTube's infra/up.sh). Empty issuer omits
# the cert-manager.io/cluster-issuer annotation so nothing reissues/clobbers it.
certManagerIssuer: ""

# No private mainnet RPC keys locally. Instead we point the core eth client at a
# reliable public mainnet endpoint via ETH_RPC_URL so the kind env CAN exercise
# the on-chain enrichment (ENS / Unstoppable Domains) and token-gating
# (balanceOf) paths end-to-end. This value belongs here (and not in the chart
# default) precisely because the kind cluster otherwise has no way to reach
# mainnet — there is no key to fall back on.
#
# Real deployments should leave this empty and supply their own dedicated
# Alchemy/Infura key (alchemyApiKey / infuraApiKey), which take precedence over
# ETH_RPC_URL. Public endpoints are rate-limited and not for production.
#
# NOTE on reachability: the kind pod DOES have outbound egress (verified: raw
# HTTPS to public IPs and to cloudflare-eth.com / publicnode / drpc all return
# 200 from inside the cluster). The core eth client's built-in default,
# https://eth.llamarpc.com, fails here for a *DNS* reason — that host resolves to
# 0.0.0.0 / :: from this cluster's resolver, so it can never connect. That is the
# "public default was unreachable from the pod" the earlier benchmark hit. We
# therefore point ETH_RPC_URL at a host that both resolves and responds here.
#
# setup.sh overrides this with ALCHEMY_URL from the gitignored root .env when that
# file sets it (the key stays out of git), so local test/benchmark runs can use a
# real keyed RPC instead of the public fallback below.
infuraApiKey: ""
alchemyApiKey: ""
ethRpcUrl: "https://ethereum-rpc.publicnode.com"

djangoSecrets: "localsecret" # pragma: allowlist secret

introspectAccess:
  user: "introspect" # pragma: allowlist secret
  pass: "introspectpw" # pragma: allowlist secret

monitoring:
  enabled: false

debug: false

login:
  mailserverDomain: ethmail.cc
  # Set to a WalletConnect Cloud / Reown project id to enable the WalletConnect
  # connector locally. Empty ⇒ injected wallets (MetaMask/EIP-6963) only.
  walletConnectProjectId: ""

hydra:
  hydra:
    dangerousForceHttp: true
    # Production-faithful: a real Postgres (see postgres.yaml), with the chart's
    # automigration running `hydra migrate sql` before serving.
    automigration:
      enabled: true
    config:
      dsn: "postgresql://hydra:hydrapw@postgres:5432/hydra?sslmode=disable" # pragma: allowlist secret
      # Hydra's issuer is necessarily a fixed config value (OIDC), so it carries
      # the public port; our own services derive their origin per-request.
      urls:
        login: https://login.cv.127.0.0.1.nip.io:9443/login
        consent: https://login.cv.127.0.0.1.nip.io:9443/consent
        device:
          verification: https://login.cv.127.0.0.1.nip.io:9443/device
          success: https://login.cv.127.0.0.1.nip.io:9443/device/success
        self:
          issuer: https://login.cv.127.0.0.1.nip.io:9443/
      secrets:
        cookie:
          - localsecretttttt # pragma: allowlist secret
        system:
          - localsecretttttt # pragma: allowlist secret
