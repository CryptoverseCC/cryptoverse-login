# KSOPS generator: decrypts the listed SOPS Secrets at build time using the age
# key in the Argo CD repo-server.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: demo-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secret-demo.sops.yaml
  - ./secret-oidc.sops.yaml
