# Registers the demo's OAuth2 client in the deployed Hydra. Replaces the chart's
# hydra-maester OAuth2Client CR (maester is disabled on this cluster — no CRD).
# Runs as an Argo CD PostSync hook and idempotently upserts (delete-then-create),
# so re-syncs converge. client_id/secret come from the SOPS `demo-oauth2client`
# Secret (the same Secret the demo pod mounts). Both the with-port (:18443) and
# port-less redirect URIs are registered, because mozilla-django-oidc derives the
# callback from the request Host (which may or may not carry the ingress port).
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-register-oauth2-client
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: demo-register-oauth2-client
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: docker.io/curlimages/curl:8.11.1
          env:
            - name: HYDRA_ADMIN_URL
              value: http://cryptoverse-login-hydra-admin.cryptoverse-login:4445
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: demo-oauth2client
                  key: CLIENT_ID
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-oauth2client
                  key: CLIENT_SECRET
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "waiting for Hydra admin at $HYDRA_ADMIN_URL ..."
              until curl -sf -o /dev/null "$HYDRA_ADMIN_URL/health/ready"; do sleep 2; done
              cat >/tmp/body.json <<EOF
              {"client_id":"$CLIENT_ID","client_secret":"$CLIENT_SECRET","grant_types":["authorization_code","refresh_token"],"response_types":["id_token","code","token"],"scope":"openid email profile","redirect_uris":["https://cryptoverse-login-demo.127.0.0.1.nip.io:18443/oidc/callback/","https://cryptoverse-login-demo.127.0.0.1.nip.io/oidc/callback/"],"post_logout_redirect_uris":["https://cryptoverse-login-demo.127.0.0.1.nip.io:18443/","https://cryptoverse-login-demo.127.0.0.1.nip.io/"],"audience":["audience-a"],"token_endpoint_auth_method":"client_secret_post","metadata":{"app":"cryptoverse-login-demo.127.0.0.1.nip.io","restrictions":[]}}
              EOF
              echo "removing any existing client $CLIENT_ID (ignored if absent)"
              curl -s -o /dev/null -X DELETE "$HYDRA_ADMIN_URL/admin/clients/$CLIENT_ID" || true
              code=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST "$HYDRA_ADMIN_URL/admin/clients" -H 'Content-Type: application/json' --data @/tmp/body.json)
              echo "POST /admin/clients -> $code"; cat /tmp/resp; echo
              [ "$code" = "201" ] || { echo "registration FAILED"; exit 1; }
              echo "OAuth2 client '$CLIENT_ID' registered"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
