# KSOPS generator for the demo's PROD secrets — DEFERRED, not yet referenced by
# kustomization.yaml (its `generators:` entry is commented out).
#
# The prod SOPS age key does not exist yet. When the operator provisions it:
#   1. Append the prod age recipient to .sops.yaml (repo root).
#   2. Create the three *.sops.yaml files below, encrypted to the PROD recipient
#      (never the local key, never plaintext — only ENC[...] reaches git):
#        secret-demo.sops.yaml         Django secret key (fresh prod value)
#        secret-oidc.sops.yaml         demo-oauth2client CLIENT_ID/CLIENT_SECRET (fresh prod values)
#        secret-harbor-pull.sops.yaml  the `harbor-pull` dockerconfigjson (Harbor pull-only robot)
#   3. Uncomment the `generators:` block in kustomization.yaml.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: demo-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secret-demo.sops.yaml
  - ./secret-oidc.sops.yaml
  - ./secret-harbor-pull.sops.yaml
